<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>からだ記録帳</title>
<meta name="description" content="体重・食事・運動を書きとめると、カロリーを計算して毎日の助言を返す記録帳。記録はこの端末のブラウザの中だけに保存されます。">
<meta name="theme-color" content="#EEF4FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A2A" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="からだ記録帳">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2064%2064%27%3E%3Crect%20width=%2764%27%20height=%2764%27%20rx=%2715%27%20fill=%27%235468F0%27/%3E%3Ctext%20x=%2732%27%20y=%2746%27%20font-size=%2738%27%20text-anchor=%27middle%27%20fill=%27%23fff%27%20font-family=%27Hiragino%20Sans%2Csans-serif%27%3E%E8%A8%98%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2064%2064%27%3E%3Crect%20width=%2764%27%20height=%2764%27%20rx=%2715%27%20fill=%27%235468F0%27/%3E%3Ctext%20x=%2732%27%20y=%2746%27%20font-size=%2738%27%20text-anchor=%27middle%27%20fill=%27%23fff%27%20font-family=%27Hiragino%20Sans%2Csans-serif%27%3E%E8%A8%98%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Fredoka:wght@500;600&display=swap">
</head>
<body>
<style>
:root{
  --paper:#EEF4FC; --surface:#FFFFFF; --raise:#FFFFFF;
  --ink:#1C2A45; --ink-2:#5A6E8E; --ink-3:#94A5BF;
  --rule:#DAE6F4; --rule-fine:#EBF2FA;
  --ai:#00B4D8;  --ai-soft:#00B4D81C;
  --key:#5468F0; --key-sh:#C9D2FF; --key-soft:#5468F016;
  --shu:#F0546A; --moss:#12B886; --ochre:#E8A33B;
  --grape:#8B5CF6;
  color-scheme:light;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"Fredoka","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111A2A; --surface:#1A2537; --raise:#212E44;
    --ink:#E9F1FF; --ink-2:#A2B5D2; --ink-3:#74879F;
    --rule:#2D3E57; --rule-fine:#253247;
    --ai:#3AD3EA; --ai-soft:#3AD3EA22;
    --key:#8496FF; --key-sh:#2B3566; --key-soft:#8496FF20;
    --shu:#FF7A8C; --moss:#3ADCA8; --ochre:#F5BC61;
    --grape:#A78BFA;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111A2A; --surface:#1A2537; --raise:#212E44;
  --ink:#E9F1FF; --ink-2:#A2B5D2; --ink-3:#74879F;
  --rule:#2D3E57; --rule-fine:#253247;
  --ai:#3AD3EA; --ai-soft:#3AD3EA22;
  --key:#8496FF; --key-sh:#2B3566; --key-soft:#8496FF20;
  --shu:#FF7A8C; --moss:#3ADCA8; --ochre:#F5BC61;
  --grape:#A78BFA;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--gothic); font-size:15px; line-height:1.85;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-family:var(--display); font-weight:800}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--ai); outline-offset:2px; border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.wrap{width:min(940px,calc(100% - 30px)); margin-inline:auto}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ── 表紙・帯 ───────────────────────────────── */
.masthead{position:relative; background:var(--surface)}
.masthead::after{
  content:""; position:absolute; inset:auto 0 0; height:5px;
  background:linear-gradient(90deg, var(--key) 0 25%, var(--grape) 25% 50%, var(--ai) 50% 75%, var(--moss) 75% 100%);
}
.masthead-in{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0 10px}
.brand h1{font-size:29px; letter-spacing:.01em; line-height:1.15}
.brand .sub{margin-top:1px; color:var(--key); font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.26em}
.head-right{display:flex; align-items:center; gap:10px}
.theme-btn{
  padding:6px 15px; border:2px solid var(--rule); border-radius:999px;
  background:var(--paper); color:var(--ink-2);
  font-family:var(--display); font-size:12.5px; font-weight:700; white-space:nowrap;
}
.theme-btn:hover{border-color:var(--key); color:var(--key)}
.stamp{
  flex:none; display:grid; place-items:center; width:58px; height:58px;
  background:var(--key); color:#fff; border-radius:18px 18px 20px 6px;
  font-family:var(--display); font-size:17px; font-weight:800; line-height:1.1; text-align:center;
  box-shadow:0 4px 0 var(--key-sh); transform:rotate(-5deg);
}

/* ── 見出しタブ ─────────────────────────────── */
.tabs{display:flex; gap:6px; padding:2px 0 13px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:none; padding:7px 17px; border:0; border-radius:999px;
  background:var(--paper); color:var(--ink-2);
  font-family:var(--display); font-size:14px; font-weight:700; white-space:nowrap;
  transition:transform .12s, background .12s, color .12s;
}
.tabs button:hover{background:var(--key-soft); color:var(--key)}
.tabs button[aria-selected="true"]{background:var(--key); color:#fff; box-shadow:0 3px 0 var(--key-sh)}

/* ── 面・節 ─────────────────────────────────── */
main{padding:24px 0 66px}
.sheet{display:grid; gap:20px}
.block{background:var(--surface); border:1px solid var(--rule); border-radius:20px; padding:22px 24px}
.block > * + *{margin-top:14px}
.eyebrow{
  display:flex; align-items:center; gap:9px; margin:0 0 4px;
  color:var(--key); font-family:var(--display); font-size:12px; font-weight:800; letter-spacing:.12em;
}
.eyebrow::before{content:""; flex:none; width:9px; height:9px; border-radius:3px; background:var(--key)}
.eyebrow::after{content:""; flex:1; height:2px; border-radius:2px; background:var(--rule-fine)}
.block h2{font-size:19px; letter-spacing:.01em}
.note{color:var(--ink-2); font-size:12.5px; line-height:1.85}
.note-alert{color:var(--shu); font-weight:500}
.hair{height:2px; border:0; border-radius:2px; background:var(--rule-fine); margin:0}

/* ── 今日の主数値（持ち上げるのはここだけ）──── */
.readout{
  background:var(--raise); border:2px solid var(--ink); border-radius:26px;
  padding:22px 26px 20px; box-shadow:0 6px 0 var(--ink);
}
.readout-top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.readout-top h2{font-size:17px}
.readout-date{
  padding:2px 12px; border-radius:999px; background:var(--paper);
  color:var(--ink-2); font-family:var(--mono); font-size:12px; font-weight:500;
}
.figure{display:flex; align-items:baseline; gap:9px; margin-top:2px}
.figure b{font-family:var(--mono); font-size:66px; font-weight:600; line-height:1.1; color:var(--ai)}
.figure .unit{font-family:var(--display); font-size:14px; font-weight:700; color:var(--ink-2)}
.figure.over b{color:var(--shu)}
.meter{height:14px; margin:12px 0 16px; background:var(--rule-fine); border-radius:999px; overflow:hidden}
.meter i{display:block; height:100%; border-radius:999px; background:var(--ai); transition:width .35s ease}
.meter.over i{background:var(--shu)}
.tally{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.tally div{padding:10px 14px; background:var(--paper); border-radius:14px}
.tally dt{color:var(--ink-2); font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.08em}
.tally dd{margin:0; font-family:var(--mono); font-size:22px; font-weight:600}

/* ── 三大栄養素 ─────────────────────────────── */
.pfc{display:grid; gap:11px}
.pfc-row{display:grid; grid-template-columns:5.6em 1fr 8.6em; align-items:center; gap:12px}
.pfc-row span:first-child{font-family:var(--display); font-size:12.5px; font-weight:700}
.pfc-track{height:11px; background:var(--rule-fine); border-radius:999px; overflow:hidden}
.pfc-track i{display:block; height:100%; border-radius:999px}
.pfc-p i{background:var(--ai)} .pfc-f i{background:var(--grape)} .pfc-c i{background:var(--moss)}
.pfc-val{font-family:var(--mono); font-size:12.5px; color:var(--ink-2); text-align:right}

/* ── 台帳 ───────────────────────────────────── */
.ledger{display:grid}
.ledger .row{
  display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:13px;
  padding:10px 0; border-bottom:2px dotted var(--rule);
}
.ledger .row:last-child{border-bottom:0}
.row-main{font-size:14.5px; font-weight:500}
.row-sub{color:var(--ink-3); font-size:11.5px}
.row-val{font-family:var(--mono); font-size:17px; font-weight:600; white-space:nowrap}
.row-val small{margin-left:5px; color:var(--ink-3); font-family:var(--gothic); font-size:11px; font-weight:400}
.tag{
  display:inline-block; margin-right:8px; padding:1px 10px; border-radius:999px;
  background:var(--rule-fine); color:var(--ink-2);
  font-family:var(--display); font-size:11px; font-weight:700; vertical-align:1px;
}
.tag-breakfast{background:#DCEBFF; color:#2266B8}
.tag-lunch{background:#D2F1F8; color:#08788A}
.tag-dinner{background:#EDE4FF; color:#6B3FD4}
.tag-snack{background:#D6F3E9; color:#0C7A5E}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tag-breakfast{background:#1E3A5C; color:#8FC4FF}
  :root:not([data-theme="light"]) .tag-lunch{background:#12454F; color:#63DDF0}
  :root:not([data-theme="light"]) .tag-dinner{background:#382A63; color:#C4A9FF}
  :root:not([data-theme="light"]) .tag-snack{background:#12463A; color:#5FE0B8}
}
:root[data-theme="dark"] .tag-breakfast{background:#1E3A5C; color:#8FC4FF}
:root[data-theme="dark"] .tag-lunch{background:#12454F; color:#63DDF0}
:root[data-theme="dark"] .tag-dinner{background:#382A63; color:#C4A9FF}
:root[data-theme="dark"] .tag-snack{background:#12463A; color:#5FE0B8}
.strike{
  width:28px; height:28px; padding:0; border:0; border-radius:50%;
  background:var(--rule-fine); color:var(--ink-3); font-size:15px; line-height:1;
  transition:background .12s, color .12s;
}
.strike:hover{background:var(--shu); color:#fff}
.empty{color:var(--ink-3); font-size:13px; padding:6px 0}
.slot-head{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  margin-top:18px; padding:5px 13px; background:var(--paper); border-radius:999px; font-size:14px;
}
.slot-head span:last-child{font-family:var(--mono); font-size:14px; font-weight:600}

/* ── 数値の並び ─────────────────────────────── */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stats div{padding:11px 14px; background:var(--paper); border-radius:14px}
.stats dt{color:var(--ink-2); font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.06em}
.stats dd{margin:0; font-family:var(--mono); font-size:21px; font-weight:600}
.stats dd small{margin-left:3px; color:var(--ink-3); font-family:var(--gothic); font-size:11px; font-weight:400}
.defs{display:grid}
.defs div{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:10px 0; border-bottom:2px dotted var(--rule)}
.defs div:last-child{border-bottom:0}
.defs dt{color:var(--ink-2); font-size:13px}
.defs dd{margin:0; font-family:var(--mono); font-size:16px; font-weight:600; text-align:right}

/* ── 記入欄 ─────────────────────────────────── */
.fields{display:grid; grid-template-columns:1fr 1fr; gap:14px 18px}
.field{display:grid; gap:5px}
.field.wide{grid-column:1/-1}
.field label{font-family:var(--display); font-size:12.5px; font-weight:700}
.field input,.field select{
  width:100%; padding:11px 14px; border:2px solid var(--rule); border-radius:14px;
  background:var(--paper); color:var(--ink); font-family:var(--gothic); font-size:15px;
}
.field input.num,.field select.num{font-family:var(--mono)}
.field input::placeholder{color:var(--ink-3)}
.field input:focus,.field select:focus{border-color:var(--ai); outline:none}
.actions{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; gap:13px}
.btn{
  padding:11px 26px; border:0; border-radius:999px;
  background:var(--key); color:#fff; box-shadow:0 4px 0 var(--key-sh);
  font-family:var(--display); font-size:15px; font-weight:800;
  transition:transform .1s, box-shadow .1s;
}
.btn:hover{transform:translateY(2px); box-shadow:0 2px 0 var(--key-sh)}
.btn.ghost{background:var(--paper); color:var(--ink); box-shadow:0 4px 0 var(--rule)}
.btn.ghost:hover{box-shadow:0 2px 0 var(--rule)}
.btn.danger{background:var(--shu); color:#fff; box-shadow:0 4px 0 var(--rule)}
.btn.link{
  padding:0; background:none; box-shadow:none; color:var(--ai); font-size:13.5px;
  text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px;
}
.btn.link:hover{transform:none; color:var(--key)}
.filebtn{display:inline-block; cursor:pointer}
.filebtn input{display:none}

/* ── 計算欄 ─────────────────────────────────── */
.calc{
  grid-column:1/-1; display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap; padding:14px 20px; background:var(--ai-soft); border-radius:18px;
}
.calc b{font-family:var(--mono); font-size:34px; font-weight:600; line-height:1.1; color:var(--ai)}
.calc .kcal{margin-left:5px; font-family:var(--display); font-size:13px; font-weight:700; color:var(--ink-2)}
.calc .expr{font-family:var(--mono); font-size:12.5px; color:var(--ink-2)}

/* ── 助言 ───────────────────────────────────── */
.advice{display:grid; gap:14px}
.card{background:var(--surface); border:2px solid var(--rule); border-radius:20px; padding:17px 22px}
.card h3{font-size:16.5px; margin-bottom:5px}
.card p{color:var(--ink-2); font-size:13.5px; line-height:1.9}
.card .lv{
  display:inline-block; margin-bottom:7px; padding:1px 12px; border-radius:999px;
  font-family:var(--display); font-size:11px; font-weight:800; letter-spacing:.06em; color:#fff;
}
.card.alert{border-color:var(--shu)} .card.alert .lv{background:var(--shu)}
.card.warn{border-color:var(--ochre)} .card.warn .lv{background:var(--ochre)}
.card.good{border-color:var(--moss)} .card.good .lv{background:var(--moss)}
.card.info{border-color:var(--ai)} .card.info .lv{background:var(--ai)}

/* ── 但し書き・報せ ─────────────────────────── */
.banner{
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding:13px 20px; background:var(--key-soft); border-radius:18px;
  color:var(--ink-2); font-size:12.5px;
}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  padding:11px 22px; border-radius:999px; background:var(--ink); color:var(--paper);
  font-family:var(--display); font-size:13.5px; font-weight:700;
  box-shadow:0 10px 26px #1c2a4533; z-index:20;
}
.disclaim{color:var(--ink-3); font-size:11.5px; line-height:1.85; padding:0 4px}
.colophon{margin-top:30px; padding-top:16px; border-top:2px dotted var(--rule); color:var(--ink-3); font-size:11.5px}

/* ── 図表 ───────────────────────────────────── */
.chart-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.seg{display:flex; gap:5px; padding:3px; background:var(--paper); border-radius:999px}
.seg button{
  padding:5px 15px; border:0; border-radius:999px; background:none; color:var(--ink-2);
  font-family:var(--display); font-size:12px; font-weight:700;
}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.chart{width:100%; height:auto; display:block; overflow:visible}
.chart text{fill:var(--ink-3); font-family:var(--mono); font-size:12px; font-weight:500}
.chart text.target-label{fill:var(--shu); font-weight:600}
.slopeline{
  display:inline-block; padding:3px 14px; border-radius:999px; background:var(--ai-soft);
  color:var(--ink-2); font-family:var(--mono); font-size:12.5px; font-weight:500;
}

@media (max-width:720px){
  .fields{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .figure b{font-size:52px}
  .tally{grid-template-columns:1fr; gap:7px}
  .tally div{display:flex; align-items:baseline; justify-content:space-between}
  .pfc-row{grid-template-columns:4.6em 1fr 7.4em; gap:9px}
  .block{padding:18px 16px; border-radius:18px}
  .readout{padding:18px 18px 16px; border-radius:22px}
  .brand h1{font-size:23px}
  .brand .sub{display:none}
  .theme-btn{padding:6px 12px; font-size:12px}
  .stamp{width:48px; height:48px; font-size:14px}
}
</style>

<header class="masthead">
  <div class="wrap masthead-in">
    <div class="brand">
      <h1>からだ記録帳</h1>
      <p class="sub">weight · meals · exercise</p>
    </div>
    <div class="head-right">
      <button type="button" class="theme-btn" id="theme-btn" hidden>配色：自動</button>
      <div class="stamp" aria-hidden="true">記録</div>
    </div>
  </div>
  <nav class="wrap"><div class="tabs" role="tablist" id="tabs"></div></nav>
</header>

<main class="wrap"><div id="panel"></div>
  <p class="colophon">記録はこの端末のブラウザの中だけに保存されます。ほかの端末や外部へは送られません。</p>
</main>

<script>
"use strict";

/* 配色の指定を、画面が描かれる前に反映する（自動 / 明るい / 暗い） */
const THEME_KEY = "karada-theme";
function applyTheme(v){
  const root = document.documentElement;
  if (v === "light" || v === "dark") root.dataset.theme = v;
  else delete root.dataset.theme;
}
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e){ /* 読めなければ自動のまま */ }

/* 別の書き方でも探せるようにする読み替え表。
   カタカナ・ひらがな・大文字小文字・長音は norm() が吸収するので、
   ここには主に「漢字↔かな」と、よくある言い換え・打ち間違いを書く。 */
const ALIAS = {
  "ごはん（白米）":"白米 ご飯 米 ライス めし",
  "ごはん（玄米）":"玄米ご飯 玄米",
  "おにぎり（鮭）":"お握り おむすび 鮭 しゃけ",
  "食パン":"パン トースト",
  "うどん":"饂飩",
  "そば":"蕎麦",
  "スパゲッティ":"パスタ",
  "中華麺（ゆで）":"ラーメンの麺 中華めん",
  "もち":"餅 お餅",
  "コーンフレーク":"シリアル グラノーラ",
  "鶏むね肉（皮なし）":"鶏胸肉 とりむね ムネ肉 チキン",
  "鶏もも肉（皮なし）":"鶏腿肉 とりもも モモ肉 チキン",
  "鶏もも肉（皮つき）":"鶏腿肉 とりもも モモ肉 チキン",
  "鶏ささみ":"ささ身 笹身 チキン",
  "豚ロース":"ぶたロース",
  "豚バラ":"ぶたばら 豚ばら",
  "豚ヒレ":"豚ひれ",
  "牛もも肉":"牛腿",
  "牛バラ（カルビ）":"カルビ 牛ばら",
  "牛ヒレ":"牛ひれ フィレ",

/* 探すときの表記ゆれをならす：大文字小文字、カタカナ→ひらがな、長音と空白を落とす */
function norm(str){
  return String(str).toLowerCase()
    .replace(/[\u30A1-\u30F6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); })
    .replace(/[\u30FC\u2010-\u2015\s\u3000]/g, "");
}

/* ══ 計算 ════════════════════════════════════════════════════ */
const KCAL_PER_KG = 7200;              /* 体脂肪1kgあたりのカロリー */
const ACTIVITY = [
  ["low","低い",1.2,"座り仕事が中心で、日常の移動が少ない"],
  ["light","やや低い",1.375,"デスクワーク中心。軽い家事や散歩をする"],
  ["moderate","ふつう",1.55,"立ち仕事や外回りが多い"],
  ["high","高い",1.725,"力仕事で一日中よく動く"]
];
const SLOTS = [["breakfast","朝食"],["lunch","昼食"],["dinner","夕食"],["snack","間食"]];

const r1 = function(n){ return Math.round(n*10)/10; };
const factor = function(id){ const a = ACTIVITY.find(function(x){return x[0]===id;}); return a ? a[2] : 1.375; };
const slotName = function(id){ const s = SLOTS.find(function(x){return x[0]===id;}); return s ? s[1] : "食事"; };

/* 基礎代謝量（Mifflin-St Jeor式） */
function bmrOf(p, kg){
  const base = 10*kg + 6.25*p.height - 5*p.age;
  return Math.round(p.sex === "male" ? base + 5 : base - 161);
}
/* 日常生活での消費カロリー。運動記録はここに含めず、別に加算する */
function maintOf(p, kg){ return Math.round(bmrOf(p,kg) * factor(p.activity)); }
function bmiOf(kg, cm){ const m = cm/100; return Math.round(kg/(m*m)*10)/10; }
function stdWeight(cm){ const m = cm/100; return Math.round(22*m*m*10)/10; }
function bmiCat(v){
  if (v < 18.5) return ["低体重（やせ）","low"];
  if (v < 25)   return ["普通体重","normal"];
  if (v < 30)   return ["肥満（1度）","over"];
  if (v < 35)   return ["肥満（2度）","over"];
  if (v < 40)   return ["肥満（3度）","over"];
  return ["肥満（4度）","over"];
}
/* 消費カロリー = METs × 体重kg × 時間h × 1.05 */
function exKcal(mets, kg, minutes){ return Math.round(mets * kg * (minutes/60) * 1.05); }

/* 1日の目標値。摂取目標が基礎代謝を下回る場合は基礎代謝で下げ止める */
function targetsOf(p, kg){
  const bmr = bmrOf(p,kg), maint = maintOf(p,kg);
  const gaining = p.target > kg;
  const swing = Math.abs(p.pace) * KCAL_PER_KG / 7;
  const raw = maint + (gaining ? swing : -swing);
  const capped = !gaining && raw < bmr;
  const intake = Math.round(capped ? bmr : raw);
  const protein = Math.round(kg * (gaining ? 1.6 : 1.4));
  const fat = Math.round(intake * .25 / 9);
  const carb = Math.max(0, Math.round((intake - protein*4 - fat*9) / 4));
  return {bmr:bmr, maint:maint, intake:intake, deficit:Math.round(maint-intake),
          protein:protein, fat:fat, carb:carb, capped:capped, gaining:gaining};
}

/* ══ 日付 ════════════════════════════════════════════════════ */
function dstr(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function today(){ return dstr(new Date()); }
function dnum(s){ const a = s.split("-").map(Number); return Math.round(Date.UTC(a[0], a[1]-1, a[2]) / 86400000); }
function fromNum(n){ return new Date(n*86400000).toISOString().slice(0,10); }
function shift(s, k){ return fromNum(dnum(s)+k); }
function between(a, b){ return dnum(b) - dnum(a); }
function jDate(s){ const a = s.split("-"); return (+a[0]) + "年" + (+a[1]) + "月" + (+a[2]) + "日"; }
function sDate(s){ const a = s.split("-"); return (+a[1]) + "/" + (+a[2]); }

/* ══ 集計 ════════════════════════════════════════════════════ */
function onDate(list, d){ return list.filter(function(x){ return x.date === d; }); }
function inRange(list, from, to){ return list.filter(function(x){ return x.date >= from && x.date <= to; }); }
function sumMeals(list){
  return list.reduce(function(t,m){
    return {kcal:t.kcal+m.kcal, p:t.p+m.p, f:t.f+m.f, c:t.c+m.c};
  }, {kcal:0,p:0,f:0,c:0});
}
function sumBurn(list){ return list.reduce(function(t,e){ return t + e.kcal; }, 0); }

/* 同じ日の複数記録は平均して、日付昇順の1日1点にまとめる */
function dailyWeights(list){
  const bucket = {};
  list.forEach(function(w){ (bucket[w.date] = bucket[w.date] || []).push(w.kg); });
  return Object.keys(bucket).sort().map(function(d){
    const v = bucket[d];
    return {date:d, kg: Math.round(v.reduce(function(a,b){return a+b;},0)/v.length*10)/10};
  });
}
function latestWeight(list){
  const s = list.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  return s.length ? s[s.length-1] : null;
}
/* 最小二乗法で体重の変化量(kg/週)を求める */
function slopePerWeek(points){
  if (points.length < 2) return null;
  const xs = points.map(function(p){ return dnum(p.date); });
  const ys = points.map(function(p){ return p.kg; });
  const mx = xs.reduce(function(a,b){return a+b;},0)/xs.length;
  const my = ys.reduce(function(a,b){return a+b;},0)/ys.length;
  let num = 0, den = 0;
  for (let i = 0; i < xs.length; i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
  if (den === 0) return null;
  return Math.round(num/den*7*100)/100;
}
/* 今日または昨日を起点に、記録が続いている日数 */
function streakOf(dates, t){
  const set = new Set(dates);
  let cur = set.has(t) ? t : shift(t,-1);
  if (!set.has(cur)) return 0;
  let n = 0;
  while (set.has(cur)){ n++; cur = shift(cur,-1); }
  return n;
}
function nutriOf(food, grams){
  const k = grams/100;
  return {kcal:Math.round(food.kcal*k), p:r1(food.p*k), f:r1(food.f*k), c:r1(food.c*k)};
}

<script>
"use strict";

/* ══ 助言 ════════════════════════════════════════════════════
   一般論ではなく、記録から計算した数値を必ず添えて返す。            */
const LEVEL_RANK = {alert:0, warn:1, good:2, info:3};
const LEVEL_NAME = {alert:"要注意", warn:"気をつけたいこと", good:"よい調子", info:"ヒント"};

function buildAdvice(S, t){
  const out = [];
  const P = S.profile;
  if (!P) return [{id:"p", lv:"info", title:"はじめに、からだの情報を記入してください",
    body:"「設定」で身長・年齢・性別・目標体重を入れると、基礎代謝と1日の目標カロリーを計算し、ここにあなた向けの助言を並べます。"}];

  const last = latestWeight(S.weights);
  if (!last) return [{id:"w", lv:"info", title:"まず今日の体重を記録してください",
    body:"体重が1件でも入ると、基礎代謝・目標カロリー・目標達成の見通しを計算できます。朝、起きてトイレを済ませたあと、同じ服装で測ると誤差が出にくくなります。"}];

  const kg = last.kg;
  const T = targetsOf(P, kg);
  const bmi = bmiOf(kg, P.height);
  const cat = bmiCat(bmi);

  out.push({id:"bmi", lv: cat[1]==="normal" ? "good" : "info",
    title:"BMI は " + bmi + "（" + cat[0] + "）",
    body: cat[1]==="normal"
      ? "身長" + P.height + "cm の標準体重は " + stdWeight(P.height) + "kg。いまは健康的な範囲です。体重の数字より、体組成と体調を軸に整えていきましょう。"
      : cat[1]==="over"
        ? "身長" + P.height + "cm の標準体重は " + stdWeight(P.height) + "kg。まずは今の体重の3〜5%（" + r1(kg*.03) + "〜" + r1(kg*.05) + "kg）を落とすところから。それだけで血圧や血糖の改善が見込めます。"
        : "身長" + P.height + "cm の標準体重は " + stdWeight(P.height) + "kg。これ以上減らすのはおすすめできません。減量より、たんぱく質と筋トレでからだを作る方向へ切り替えましょう。"});

  const remain = r1(Math.abs(kg - P.target));
  if (remain < .3){
    out.push({id:"goal", lv:"good", title:"目標体重に届いています",
      body:"目標 " + P.target + "kg に対して、いまが " + kg + "kg。ここからは維持の期間です。摂取カロリーを維持量の " + T.maint + "kcal まで少しずつ戻しながら、2〜4週間かけて体重が ±2kg に収まるか見ていきましょう。"});
  } else {
    const days = Math.ceil(remain / Math.abs(P.pace) * 7);
    out.push({id:"goal", lv:"info", title:"目標まで あと " + remain + "kg",
      body:"週 " + Math.abs(P.pace) + "kg のペースなら約 " + days + "日、" + jDate(shift(t,days)) + "ごろに " + P.target + "kg へ届く計算です。1日の目標摂取は " + T.intake + "kcal（維持量 " + T.maint + "kcal に対して " + (T.gaining?"＋":"−") + Math.abs(T.deficit) + "kcal）。"});
  }

  if (T.capped){
    out.push({id:"pace", lv:"alert", title:"減量のペースが速すぎます",
      body:"週 " + P.pace + "kg を達成するには、基礎代謝の " + T.bmr + "kcal を下回る食事量が必要になります。筋肉が落ちて代謝が下がり、戻りやすいからだになります。ペースを週0.5kgほどに緩めるか、運動を増やして差を作ってください。"});
  }

  const meals = onDate(S.meals, t);
  const exs = onDate(S.exercises, t);
  const got = sumMeals(meals);
  const burn = sumBurn(exs);

  if (meals.length === 0){
    out.push({id:"meal0", lv:"info", title:"今日の食事がまだ記録されていません",
      body:"目標は " + T.intake + "kcal。食べたそばから記録しておくと、夕方の時点で「あと何kcal使えるか」が見えて、食べ過ぎを防げます。"});
  } else {
    const budget = T.intake + burn;
    const rest = Math.round(budget - got.kcal);
    /* 夕食が入るまでは「食べ足りない」判定を出さない（1日の途中のため） */
    const dayDone = meals.some(function(m){ return m.slot === "dinner"; }) || t > today();

    if (rest < -200){
      out.push({id:"over", lv:"warn", title:"今日は目標を " + Math.abs(rest) + "kcal 超えています",
        body:"摂取 " + Math.round(got.kcal) + "kcal に対して、使える枠は " + budget + "kcal（目標 " + T.intake + "kcal ＋ 運動 " + burn + "kcal）でした。" + (burn === 0 ? "速歩を30分で約 " + exKcal(5,kg,30) + "kcal 使えます。" : "明日は主食を1割減らすか、揚げ物をひとつ控えると戻せます。") + "1日超えただけで脂肪は増えません。翌日に戻せば大丈夫です。"});
    } else if (dayDone && got.kcal < T.bmr){
      out.push({id:"under", lv:"alert", title:"食べる量が少なすぎます",
        body:"今日の摂取は " + Math.round(got.kcal) + "kcal で、基礎代謝の " + T.bmr + "kcal を下回っています。この状態が続くと筋肉が落ち、かえって痩せにくくなります。少なくとも基礎代謝の分は食べてください。"});
    } else {
      out.push({id:"ok", lv:"good", title:"今日はあと " + Math.max(0,rest) + "kcal 使えます",
        body:"摂取 " + Math.round(got.kcal) + "kcal ／ 枠 " + budget + "kcal（目標 " + T.intake + "kcal ＋ 運動 " + burn + "kcal）。この調子なら計画どおりです。"});
    }

    if (got.p < T.protein * .7){
      out.push({id:"pro", lv:"warn", title:"たんぱく質が あと " + Math.round(T.protein-got.p) + "g 足りません",
        body:"目標 " + T.protein + "g に対して今日は " + Math.round(got.p) + "g。不足すると、減るのは脂肪ではなく筋肉です。卵1個で6g、納豆1パックで7g、ギリシャヨーグルト1個で10g、鶏むね肉100gで23g 補えます。"});
    } else if (got.p >= T.protein){
      out.push({id:"pro", lv:"good", title:"たんぱく質は足りています",
        body:"今日は " + Math.round(got.p) + "g（目標 " + T.protein + "g）。筋肉を守りながら体重を落とせている状態です。"});
    }

    const fatRatio = got.kcal > 0 ? got.f*9/got.kcal : 0;
    if (got.kcal > 800 && fatRatio > .35){
      out.push({id:"fat", lv:"warn", title:"脂質が今日の " + Math.round(fatRatio*100) + "% を占めています",
        body:"目安は20〜30%（" + T.fat + "g 前後）で、今日は " + Math.round(got.f) + "g。脂質は1gで9kcal あるので、揚げ物・マヨネーズ・脂身の多い肉をひとつ減らすだけで100kcal 以上変わります。"});
    }

    const snack = meals.filter(function(m){ return m.slot === "snack"; }).reduce(function(a,m){ return a+m.kcal; },0);
    if (got.kcal > 0 && snack/got.kcal > .2){
      out.push({id:"snack", lv:"warn", title:"間食が今日の " + Math.round(snack/got.kcal*100) + "% を占めています",
        body:"間食 " + Math.round(snack) + "kcal。目安は1日200kcal までです。食事のたんぱく質を増やすと空腹感が減り、間食は自然に減ります。どうしても欲しいときは、ナッツ25g かヨーグルトに置き換えてみてください。"});
    }
  }

  const pts = dailyWeights(S.weights).filter(function(p){ return p.date >= shift(t,-21); });
  const sl = slopePerWeek(pts);
  if (sl !== null && pts.length >= 3){
    const span = between(pts[0].date, pts[pts.length-1].date) + 1;
    if (!T.gaining && sl > .15){
      out.push({id:"tr", lv:"warn", title:"この " + span + "日は 週 " + r1(sl) + "kg のペースで増えています",
        body:"減らしたいのに増える向きです。まず食事記録の抜けを疑ってください（飲み物、調味料、つまみ食い）。抜けがないなら、目標摂取を200kcal 下げるか、運動を週2回増やしましょう。"});
    } else if (!T.gaining && sl < -1.2){
      out.push({id:"tr", lv:"warn", title:"減り方が速すぎます（週 " + r1(sl) + "kg）",
        body:"週1kg を超える減量は、筋肉の分解と揺り戻しにつながります。摂取を100〜200kcal 増やして、週0.5kg 前後に落ち着かせてください。"});
    } else if (!T.gaining && sl <= -.15){
      out.push({id:"tr", lv:"good", title:"順調に減っています（週 " + r1(sl) + "kg）",
        body:"直近 " + span + "日の傾向です。このペースなら目標 " + P.target + "kg まであと約 " + Math.ceil(Math.abs(kg-P.target)/Math.abs(sl)*7) + "日。いまのやり方を変えずに続けてください。"});
    } else if (span >= 14){
      out.push({id:"tr", lv:"info", title:"体重が " + span + "日 ほぼ横ばいです",
        body:"停滞は、からだが省エネに切り替わった合図で、減量中には必ず訪れます。①たんぱく質を体重×1.4g まで増やす ②筋トレを週2回入れる ③1〜2週間だけ維持量（" + T.maint + "kcal）に戻す——このどれかで動き出すことが多いです。"});
    }
  } else if (dailyWeights(S.weights).length < 3){
    out.push({id:"tr", lv:"info", title:"体重の傾向を出すには、あと少し記録が必要です",
      body:"いまは " + dailyWeights(S.weights).length + "日分。3日分たまると増減のペースを計算して、グラフに傾向線を引きます。体重は水分だけで1〜2kg 動くので、1日の上下に一喜一憂しないでください。"});
  }

  const week = inRange(S.exercises, shift(t,-6), t);
  const activeDays = new Set(week.map(function(e){ return e.date; })).size;
  const weekBurn = sumBurn(week);
  if (activeDays === 0){
    out.push({id:"ex", lv:"info", title:"この1週間、運動の記録がありません",
      body:"食事だけで減らすと筋肉も一緒に落ちます。まずは1回20分の速歩から。体重 " + r1(kg) + "kg なら20分で約 " + exKcal(5,kg,20) + "kcal、週3回で " + (exKcal(5,kg,20)*3) + "kcal の上乗せになります。"});
  } else if (activeDays >= 3){
    out.push({id:"ex", lv:"good", title:"この1週間で " + activeDays + "日 動けています",
      body:"合計 " + weekBurn + "kcal（体脂肪に直すと約 " + r1(weekBurn/KCAL_PER_KG) + "kg 分）。週3日以上は理想的な頻度です。慣れてきたら筋トレを1回混ぜると、代謝が落ちにくくなります。"});
  } else {
    out.push({id:"ex", lv:"info", title:"この1週間の運動は " + activeDays + "日 でした",
      body:"合計 " + weekBurn + "kcal。あと " + (3-activeDays) + "日 増やせば週3日です。「毎日やる」より「週3日を続ける」ほうが結果につながります。"});
  }

  const streak = streakOf(S.weights.map(function(w){return w.date;}).concat(S.meals.map(function(m){return m.date;})), t);
  if (streak >= 3){
    out.push({id:"st", lv:"good", title:streak + "日 続けて記録できています",
      body:"記録をつけているだけで食べ方は変わります。完璧でなくてかまいません。途切れさせないことを何より優先してください。"});
  }

  return out.sort(function(a,b){ return LEVEL_RANK[a.lv] - LEVEL_RANK[b.lv]; });
}

const KEY = "karada-kirokucho-v1";

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}
function blank(){ return {sample:false, profile:null, weights:[], meals:[], exercises:[]}; }

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return sampleData();
    const d = JSON.parse(raw);
    return {sample:false, profile:d.profile || null,
      weights:Array.isArray(d.weights)?d.weights:[],
      meals:Array.isArray(d.meals)?d.meals:[],
      exercises:Array.isArray(d.exercises)?d.exercises:[]};
  } catch (e){ return sampleData(); }
}

  if (S.sample) return;                       /* 見本は保存しない */

/* ══ 体重グラフ ══════════════════════════════════════════════ */
function chartSVG(points, target){
  if (!points.length) return '<p class="empty">この期間の記録がありません。</p>';
  const W = 780, H = 300, L = 46, R = 20, TP = 18, B = 32;
  const xs = points.map(function(p){ return dnum(p.date); });
  const ys = points.map(function(p){ return p.kg; });
  const pool = typeof target === "number" ? ys.concat([target]) : ys;
  const minX = Math.min.apply(null,xs), maxX = Math.max.apply(null,xs);
  const lo = Math.min.apply(null,pool), hi = Math.max.apply(null,pool);
  const pad = Math.max(hi-lo, 1) * .18;
  const minY = lo - pad, maxY = hi + pad;
  const pw = W-L-R, ph = H-TP-B;
  const X = function(d){ return maxX===minX ? L+pw/2 : L + (d-minX)/(maxX-minX)*pw; };
  const Y = function(v){ return TP + (1-(v-minY)/(maxY-minY))*ph; };

  const co = points.map(function(p){ return {d:p.date, kg:p.kg, x:X(dnum(p.date)), y:Y(p.kg)}; });
  let g = "";
  for (let i = 0; i <= 4; i++){
    const v = minY + (maxY-minY)/4*i, y = Y(v);
    g += '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--rule)" stroke-width="1.5"/>'
       + '<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  const step = Math.max(1, Math.ceil(co.length/6));
  let lab = "";
  co.forEach(function(p,i){
    if (i % step === 0 || i === co.length-1)
      lab += '<text x="'+p.x.toFixed(1)+'" y="'+(H-B+20)+'" text-anchor="middle">'+sDate(p.d)+'</text>';
  });

  let tgt = "";
  if (typeof target === "number" && target >= minY && target <= maxY){
    const y = Y(target);
    tgt = '<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--shu)" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>'
        + '<text class="target-label" x="'+(W-R)+'" y="'+(y-7).toFixed(1)+'" text-anchor="end">目標 '+target+'kg</text>';
  }

  let trend = "";
  const sl = slopePerWeek(points);
  if (sl !== null && points.length >= 3){
    const mx = xs.reduce(function(a,b){return a+b;},0)/xs.length;
    const my = ys.reduce(function(a,b){return a+b;},0)/ys.length;
    const per = sl/7;
    trend = '<line x1="'+X(minX).toFixed(1)+'" y1="'+Y(my+(minX-mx)*per).toFixed(1)+'" x2="'+X(maxX).toFixed(1)+'" y2="'+Y(my+(maxX-mx)*per).toFixed(1)+'" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>';
  }

  const line = co.map(function(p){ return p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
  const area = L+","+(H-B)+" " + line + " " + co[co.length-1].x.toFixed(1)+","+(H-B);
  const dots = co.map(function(p){
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="var(--surface)" stroke="var(--ai)" stroke-width="3"><title>'+p.d+"："+p.kg+'kg</title></circle>';
  }).join("");

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="体重の推移">'
    + '<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--ai)" stop-opacity=".30"/><stop offset="100%" stop-color="var(--ai)" stop-opacity="0"/></linearGradient><pattern id="hougan" width="14" height="14" patternUnits="userSpaceOnUse">'
    + '<circle cx="7" cy="7" r="1.6" fill="var(--rule-fine)"/></pattern></defs>'
    + '<rect x="'+L+'" y="'+TP+'" width="'+pw+'" height="'+ph+'" fill="url(#hougan)"/>'
    + g + tgt
    + (co.length > 1 ? '<polygon points="'+area+'" fill="url(#fade)"/>' : "")
    + trend
    + '<polyline points="'+line+'" fill="none" stroke="var(--ai)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'
    + dots + lab + '</svg>';
}

    + '<div class="seg">'+[[30,"30日"],[90,"90日"],[0,"全部"]].map(function(r){
        return '<button type="button" data-range="'+r[0]+'" aria-pressed="'+(ui.range===r[0])+'">'+r[1]+'</button>'; }).join("")
    + '</div></div>'

    + '<hr class="hair"><dl class="stats">'
    + '<div><dt>最新</dt><dd>'+(last?last.kg.toFixed(1):"—")+'<small>kg</small></dd></div>'
    + '<div><dt>開始から</dt><dd>'+(first&&last?(last.kg-first.kg>0?"+":"")+(last.kg-first.kg).toFixed(1):"—")+'<small>kg</small></dd></div>'
    + '<div><dt>直近7件の平均</dt><dd>'+(avg!==null?avg.toFixed(1):"—")+'<small>kg</small></dd></div>'
    + '<div><dt>記録日数</dt><dd>'+pts.length+'<small>日</small></dd></div></dl></section>'
  + '<section class="block"><p class="eyebrow">記録一覧</p>'
    + (rows.length ? '<div class="ledger">' + rows.map(function(w){
        return '<div class="row"><div><p class="row-main">'+jDate(w.date)+'</p>'
          + (w.memo?'<p class="row-sub">'+esc(w.memo)+'</p>':"")+'</div>'
          + '<p class="row-val">'+w.kg.toFixed(1)+'<small>kg'+(w.fat!==undefined&&w.fat!==null?" ／ 体脂肪 "+w.fat+"%":"")+'</small></p>'
          + '<button class="strike" data-del="w" data-id="'+w.id+'" aria-label="'+w.date+'の記録を消す">×</button></div>';
      }).join("") + '</div>' : '<p class="empty">まだ記録がありません。</p>')

<script>
"use strict";

function byKeyword(list, kw){
  const q = norm(kw);
  const hit = list.filter(function(x){ return x.key.indexOf(q) >= 0 || x.ckey.indexOf(q) >= 0; });
  /* 名前や読み替えで当たったものを先に出し、分類だけで当たったものを後に回す */
  return hit.sort(function(a, b){
    return (a.key.indexOf(q) >= 0 ? 0 : 1) - (b.key.indexOf(q) >= 0 ? 0 : 1);
  });
}
/* キーワードがあれば分類をまたいで探し、無ければ選んだ分類の中から出す */
function mealCandidates(){
  const kw = ui.mKeyword.trim();
  if (kw) return byKeyword(FOODS, kw);
  return FOODS.filter(function(x){ return x.cat === ui.mCat; });
}
function mealFood(){
  const c = mealCandidates();
  return c.find(function(x){ return x.id === ui.mFood; }) || c[0] || FOODS[0];
}
function mealUnit(){ const f = mealFood(); return f.units[Math.min(ui.mUnit, f.units.length-1)]; }
function mealGrams(){ const q = Number(ui.mQty); return (isFinite(q) && q > 0) ? mealUnit()[1]*q : 0; }
function exCandidates(){
  const kw = ui.xKeyword.trim();
  if (kw) return byKeyword(EXERCISES, kw);
  return EXERCISES.filter(function(x){ return x.cat === ui.xCat; });
}
function exItem(){
  const c = exCandidates();
  return c.find(function(x){ return x.id === ui.xId; }) || c[0] || EXERCISES[0];
}
function exMinutes(){ const m = Number(ui.xMin); return (isFinite(m) && m > 0) ? m : 0; }

function panelMeal(){
  const T = S.profile ? targetsOf(S.profile, currentWeight()) : null;
  const day = onDate(S.meals, ui.mDate), tot = sumMeals(day);
  const f = mealFood(), n = nutriOf(f, mealGrams());
  const cands = mealCandidates();

  const form = ui.mCustom
    ? '<div class="field wide"><label for="cn">こんだての名前</label><input type="text" id="cn" placeholder="母のハンバーグ" required></div>'
      + '<div class="field"><label for="ck">カロリー（kcal）</label><input class="num" type="number" id="ck" step="any" min="0" required></div>'
      + '<div class="field"><label for="cp">たんぱく質（g・任意）</label><input class="num" type="number" id="cp" step="any" min="0"></div>'
      + '<div class="field"><label for="cf">脂質（g・任意）</label><input class="num" type="number" id="cf" step="any" min="0"></div>'
      + '<div class="field"><label for="cc">炭水化物（g・任意）</label><input class="num" type="number" id="cc" step="any" min="0"></div>'
    : '<div class="field"><label for="mc">分類</label><select id="mc"'+(ui.mKeyword.trim()?" disabled":"")+'>'
        + FOOD_CATS.map(function(c){ return '<option'+(c===ui.mCat?" selected":"")+'>'+c+'</option>'; }).join("") + '</select></div>'
      + '<div class="field"><label for="mk">名前で探す</label><input type="search" id="mk" placeholder="例：キムチ" value="'+esc(ui.mKeyword)+'"></div>'
      + '<div class="field wide"><label for="mf">品目（'+cands.length+'件）</label><select id="mf">'
        + (cands.length ? cands.map(function(x){ return '<option value="'+x.id+'"'+(x.id===f.id?" selected":"")+'>'+esc(x.name)+(ui.mKeyword.trim()?"（"+x.cat+"）":"")+'</option>'; }).join("")
                        : '<option value="">見つかりませんでした</option>') + '</select></div>'
      + '<div class="field"><label for="mu">目安の量</label><select id="mu" class="num">'
        + f.units.map(function(u,i){ return '<option value="'+i+'"'+(i===Math.min(ui.mUnit,f.units.length-1)?" selected":"")+'>'+esc(u[0])+(u[0]===u[1]+"g"?"":"（"+u[1]+"g）")+'</option>'; }).join("") + '</select></div>'
      + '<div class="field"><label for="mq">いくつ</label><input class="num" type="number" id="mq" step="any" min="0.1" value="'+esc(ui.mQty)+'"></div>'
      + '<div class="calc" id="mcalc">'+calcMealHTML(n)+'</div>';

  return '<div class="sheet">' + sampleBanner()
  + '<section class="block"><div class="chart-head"><p class="eyebrow" style="margin:0;flex:1">記入</p>'
    + '<button class="btn link" data-act="toggle-meal">'+(ui.mCustom?"品目から選ぶ":"一覧にないものを書く")+'</button></div>'
    + '<h2>食べたものを書きとめる</h2>'
    + '<form id="fm" class="fields">'
    + '<div class="field"><label for="md">日付</label><input class="num" type="date" id="md" value="'+ui.mDate+'" max="'+today()+'"></div>'
    + '<div class="field"><label for="ms">いつ</label><select id="ms">'
      + SLOTS.map(function(s){ return '<option value="'+s[0]+'"'+(s[0]===ui.mSlot?" selected":"")+'>'+s[1]+'</option>'; }).join("") + '</select></div>'
    + form
    + '<div class="actions"><button class="btn" type="submit">書きとめる</button></div>'
    + '</form></section>'
  + '<section class="block"><div class="chart-head"><p class="eyebrow" style="margin:0;flex:1">'+jDate(ui.mDate)+'</p>'
    + '<p class="row-val">'+Math.round(tot.kcal)+'<small>kcal'+(T?" ／ 目標 "+T.intake:"")+'</small></p></div>'
    + (day.length ? SLOTS.map(function(s){
        const rows = day.filter(function(m){ return m.slot === s[0]; });

        return '<h3 class="slot-head">'

      }).join("") + '<hr class="hair"><p class="row-val" style="text-align:right">合計 '+Math.round(tot.kcal)
        + '<small>kcal ／ P '+r1(tot.p)+' F '+r1(tot.f)+' C '+r1(tot.c)+'</small></p>'
      : '<p class="empty">まだ記録がありません。</p>')
  + '</section></div>';
}
function calcMealHTML(n){
  return '<span><b class="num">'+n.kcal+'</b><span class="kcal">kcal（'+Math.round(mealGrams())+'g）</span></span>'
    + '<span class="expr">P '+n.p+'g ／ F '+n.f+'g ／ C '+n.c+'g</span>';
}

function panelExercise(){
  const kg = currentWeight();

  const cands = exCandidates();
  const chosen = exItem();

  const form = ui.xCustom

    : '<div class="field"><label for="xc">分類</label><select id="xc"'+(ui.xKeyword.trim()?" disabled":"")+'>'
        + EX_CATS.map(function(c){ return '<option'+(c===ui.xCat?" selected":"")+'>'+c+'</option>'; }).join("") + '</select></div>'
      + '<div class="field"><label for="xk">名前で探す</label><input type="search" id="xk" placeholder="例：ピラティス" value="'+esc(ui.xKeyword)+'"></div>'
      + '<div class="field wide"><label for="xi">種目（'+cands.length+'件）</label><select id="xi">'
        + (cands.length ? cands.map(function(e){ return '<option value="'+e.id+'"'+(e.id===chosen.id?" selected":"")+'>'+esc(e.name)+'（'+e.mets+' METs'+(ui.xKeyword.trim()?"・"+e.cat:"")+'）</option>'; }).join("")
                        : '<option value="">見つかりませんでした</option>') + '</select></div>';

  return '<div class="sheet">' + sampleBanner()
  + '<section class="block"><div class="chart-head"><p class="eyebrow" style="margin:0;flex:1">記入</p>'

    + '<h2>動いたぶんを書きとめる</h2>'
    + '<form id="fx" class="fields">'
    + '<div class="field"><label for="xd">日付</label><input class="num" type="date" id="xd" value="'+ui.xDate+'" max="'+today()+'"></div>'

    + form
    + '<div class="calc" id="xcalc">'+calcExHTML(kg)+'</div>'
    + '<div class="actions"><button class="btn" type="submit">書きとめる</button>'

    + '</form></section>'
  + '<section class="block"><div class="chart-head"><p class="eyebrow" style="margin:0;flex:1">'+jDate(ui.xDate)+'</p>'

        return '<div class="row"><div><p class="row-main">'+esc(e.name)+'</p>'

        const e = EXERCISES.find(function(x){ return x.name === nm; });
        return '<div class="row"><p class="row-main">'+esc(e.name)+'</p>'
          + '<p class="row-val">'+exKcal(e.mets,kg,30)+'<small>kcal</small></p><span></span></div>';

}
function calcExHTML(kg){
  const mets = ui.xCustom ? Number(ui.xMets) : exItem().mets;
  const m = isFinite(mets) && mets > 0 ? mets : 0;
  return '<span><b class="num">'+exKcal(m,kg,exMinutes())+'</b><span class="kcal">kcal</span></span>'

}

function panelAdvice(){

    + '<section class="block"><p class="eyebrow">読みもの</p><h2>いまの記録から言えること</h2>'

}

function panelSettings(){
  const P = S.profile || {sex:"female", age:35, height:160, activity:"light", target:55, pace:.5};
  const kg = currentWeight(), T = targetsOf(P, kg);
  const paces = [[.25,"ゆっくり：週 0.25kg"],[.5,"標準：週 0.5kg"],[.75,"速め：週 0.75kg"],[1,"かなり速い：週 1kg"]];

    + '<div class="field"><label for="ps">性別</label><select id="ps">'

      + '<option value="male"'+(P.sex==="male"?" selected":"")+'>男性</option></select></div>'

    + '<div class="field"><label for="ph">身長（cm）</label><input class="num" type="number" id="ph" step="any" min="100" max="250" value="'+P.height+'" required></div>'
    + '<div class="field"><label for="pt">目標体重（kg）</label><input class="num" type="number" id="pt" step="any" min="20" max="300" value="'+P.target+'" required></div>'
    + '<div class="field wide"><label for="pv">ふだんの活動量（運動記録は別に足すので、仕事や家事の量で選んでください）</label><select id="pv">'
      + ACTIVITY.map(function(a){ return '<option value="'+a[0]+'"'+(a[0]===P.activity?" selected":"")+'>'+a[1]+'：'+a[3]+'</option>'; }).join("") + '</select></div>'
    + '<div class="field wide"><label for="pp">目指すペース</label><select id="pp">'
      + paces.map(function(p){ return '<option value="'+p[0]+'"'+(P.pace===p[0]?" selected":"")+'>'+p[1]+'（1日あたり約 '+Math.round(p[0]*KCAL_PER_KG/7)+'kcal の増減）</option>'; }).join("") + '</select></div>'
    + '<div class="actions"><button class="btn" type="submit">書きとめる</button></div>'
    + '</form></section>'
  + '<section class="block"><p class="eyebrow">計算結果</p><h2>いまの体重 '+r1(kg)+'kg で計算すると</h2>'
    + '<dl class="defs">'
    + '<div><dt>基礎代謝量</dt><dd>'+T.bmr+' kcal ／日</dd></div>'
    + '<div><dt>維持カロリー（日常生活のみ）</dt><dd>'+T.maint+' kcal ／日</dd></div>'
    + '<div><dt>目標摂取カロリー</dt><dd>'+T.intake+' kcal ／日</dd></div>'
    + '<div><dt>三大栄養素の目安</dt><dd>P '+T.protein+'g ／ F '+T.fat+'g ／ C '+T.carb+'g</dd></div></dl>'
    + (T.capped ? '<p class="note note-alert">選んだペースでは基礎代謝を下回るため、目標摂取カロリーを基礎代謝と同じ値まで引き上げています。ペースを緩めるか、運動で消費を増やしてください。</p>' : "")
    + '<p class="note">基礎代謝は Mifflin-St Jeor 式、体脂肪1kg ＝ 7,200kcal として計算しています。</p></section>'
  + '<section class="block"><p class="eyebrow">記録の管理</p><h2>控えを取る・戻す</h2>'
    + '<p class="note">記録はこの端末のブラウザの中だけに保存されます。機種変更やブラウザのデータ削除で消えるので、ときどき控えを取ってください。</p>'
    + '<div class="actions">'
    + '<button class="btn ghost" data-act="export" id="btn-export"'+((inArtifact && !saveDown) ? " hidden" : "")+'>控えを書き出す</button>'

    + '<button class="btn danger" data-act="wipe">すべて消す</button></div>'
    + '<p class="note">いまの記録：体重 '+S.weights.length+'件 ／ 食事 '+S.meals.length+'件 ／ 運動 '+S.exercises.length+'件</p>'

<script>
"use strict";

const PANELS = {today:panelToday, weight:panelWeight, meal:panelMeal, exercise:panelExercise, advice:panelAdvice, settings:panelSettings};

function toast(msg){
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const d = document.createElement("div");
  d.className = "toast"; d.setAttribute("role","status"); d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function(){ d.remove(); }, 2600);
}

/* 画面を作り直さずに、選択肢だけを書き換える。
   入力欄の要素をそのまま残すことで、日本語変換の途中でも打ち込みが途切れない。 */
function refreshMealOptions(){
  const selFood = el("mf");
  if (!selFood) return;                       /* 手入力のときは何もしない */
  const cands = mealCandidates();
  const chosen = mealFood();
  const kw = ui.mKeyword.trim();
  selFood.innerHTML = cands.length
    ? cands.map(function(x){ return '<option value="'+x.id+'"'+(x.id===chosen.id?" selected":"")+'>'+esc(x.name)+(kw?"（"+x.cat+"）":"")+'</option>'; }).join("")
    : '<option value="">見つかりませんでした</option>';
  const label = document.querySelector('label[for="mf"]');
  if (label) label.textContent = "品目（" + cands.length + "件）";
  const selCat = el("mc");
  if (selCat) selCat.disabled = !!kw;
  const selUnit = el("mu");
  if (selUnit){
    const at = Math.min(ui.mUnit, chosen.units.length - 1);
    selUnit.innerHTML = chosen.units.map(function(u, i){
      return '<option value="'+i+'"'+(i===at?" selected":"")+'>'+esc(u[0])+(u[0]===u[1]+"g"?"":"（"+u[1]+"g）")+'</option>'; }).join("");
  }
  refreshCalc();
}
function refreshExOptions(){
  const selItem = el("xi");
  if (!selItem) return;
  const cands = exCandidates();
  const chosen = exItem();
  const kw = ui.xKeyword.trim();
  selItem.innerHTML = cands.length
    ? cands.map(function(e){ return '<option value="'+e.id+'"'+(e.id===chosen.id?" selected":"")+'>'+esc(e.name)+'（'+e.mets+' METs'+(kw?"・"+e.cat:"")+'）</option>'; }).join("")
    : '<option value="">見つかりませんでした</option>';
  const label = document.querySelector('label[for="xi"]');
  if (label) label.textContent = "種目（" + cands.length + "件）";
  const selCat = el("xc");
  if (selCat) selCat.disabled = !!kw;
  refreshCalc();
}

function renderTabs(){
  el("tabs").innerHTML = TABS.map(function(t){
    return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>';
  }).join("");
}
function render(){
  const active = document.activeElement;
  /* iOSでは select や日付欄に focus() を戻すと選択画面が開き直してしまう。
     文字を打ち込む欄だけ、位置を含めて戻す。 */
  const typing = !!active && active.tagName === "INPUT" && (active.type === "search" || active.type === "text");
  const focused = typing ? active.id : null;
  let caret = null;
  if (typing){
    try { caret = typeof active.selectionStart === "number" ? active.selectionStart : null; } catch (e){ caret = null; }
  }
  renderTabs();
  el("panel").innerHTML = PANELS[ui.tab]();
  if (focused){
    const back = el(focused);
    if (back){
      back.focus();
      if (caret !== null && typeof back.setSelectionRange === "function"){
        try { back.setSelectionRange(caret, caret); } catch (e){ /* 位置を持てない入力欄は無視 */ }
      }
    }
  }
  if (saveDown) { const b = el("btn-export"); if (b) b.hidden = false; }
}
/* 見本のまま書き込もうとしたら、まず見本を片づける */
function beginReal(){
  if (leaveSample()) toast("見本を消しました。「設定」でからだの情報を入れてください");
}

/* ── 押したとき ─────────────────────────────── */
document.addEventListener("click", function(ev){
  const t = ev.target.closest("[data-tab],[data-range],[data-act],[data-del]");
  if (!t) return;

  if (t.dataset.tab){ ui.tab = t.dataset.tab; render(); window.scrollTo({top:0, behavior:"instant"}); return; }
  if (t.dataset.range !== undefined){ ui.range = Number(t.dataset.range); render(); return; }

  if (t.dataset.del){
    const id = t.dataset.id;
    if (t.dataset.del === "w") S.weights = S.weights.filter(function(x){ return x.id !== id; });
    if (t.dataset.del === "m") S.meals = S.meals.filter(function(x){ return x.id !== id; });
    if (t.dataset.del === "x") S.exercises = S.exercises.filter(function(x){ return x.id !== id; });
    save(); render(); return;
  }

  const act = t.dataset.act;
  if (act === "clear-sample"){ S = blank(); save(); render(); toast("見本を消しました"); return; }
  if (act === "toggle-meal"){ ui.mCustom = !ui.mCustom; render(); return; }
  if (act === "toggle-ex"){ ui.xCustom = !ui.xCustom; render(); return; }
  if (act === "wipe"){
    if (window.confirm("すべての記録を消します。よろしいですか？")){
      S = blank();
      try { localStorage.removeItem(KEY); } catch (e){ /* 消せない環境は無視 */ }
      render(); toast("すべて消しました");
    }
    return;
  }
  if (act === "export"){ doExport(); return; }
});

/* ── 選び直したとき ─────────────────────────── */
document.addEventListener("change", function(ev){
  const id = ev.target.id, v = ev.target.value;
  if (id === "md"){ ui.mDate = v; render(); }
  else if (id === "ms"){ ui.mSlot = v; }
  else if (id === "mc"){
    ui.mCat = v; ui.mKeyword = ""; ui.mFood = firstOfCat(v); ui.mUnit = 0;
    const box = el("mk"); if (box) box.value = "";
    refreshMealOptions();
  }
  else if (id === "mf"){ if (v){ ui.mFood = v; ui.mUnit = 0; } refreshMealOptions(); }
  else if (id === "mu"){ ui.mUnit = Number(v); refreshCalc(); }
  else if (id === "xd"){ ui.xDate = v; render(); }
  else if (id === "xc"){
    ui.xCat = v; ui.xKeyword = ""; ui.xId = firstOfExCat(v);
    const box = el("xk"); if (box) box.value = "";
    refreshExOptions();
  }
  else if (id === "xi"){ if (v) ui.xId = v; refreshExOptions(); }
  else if (id === "imp"){ doImport(ev.target); }
});

/* 日本語変換の途中は絞り込みを止めておき、確定した時点で反映する */
let composing = false;
document.addEventListener("compositionstart", function(){ composing = true; });
document.addEventListener("compositionend", function(ev){
  composing = false;
  const id = ev.target && ev.target.id;
  if (id === "mk"){ ui.mKeyword = ev.target.value; refreshMealOptions(); }
  else if (id === "xk"){ ui.xKeyword = ev.target.value; refreshExOptions(); }
});

/* ── 打ち込んでいる最中：計算欄だけ更新して、カーソルを保つ ── */
document.addEventListener("input", function(ev){
  const id = ev.target.id;
  if (id === "mk"){ ui.mKeyword = ev.target.value; ui.mUnit = 0; if (!composing) refreshMealOptions(); }
  else if (id === "xk"){ ui.xKeyword = ev.target.value; if (!composing) refreshExOptions(); }
  else if (id === "mq"){ ui.mQty = ev.target.value; refreshCalc(); }
  else if (id === "xt"){ ui.xMin = ev.target.value; refreshCalc(); }
  else if (id === "xm"){ ui.xMets = ev.target.value; refreshCalc(); }
});
function refreshCalc(){
  const m = el("mcalc");
  if (m) m.innerHTML = calcMealHTML(nutriOf(mealFood(), mealGrams()));
  const x = el("xcalc");
  if (x) x.innerHTML = calcExHTML(currentWeight());
}

/* ── 書きとめたとき ─────────────────────────── */
document.addEventListener("submit", function(ev){
  const f = ev.target;
  if (!["fw","fm","fx","fp"].includes(f.id)) return;
  ev.preventDefault();

  if (f.id === "fw"){
    const d = el("wd").value || today();
    const kg = Number(el("wk").value);
    if (!isFinite(kg) || kg <= 0 || kg > 400){ toast("体重は 0〜400kg の範囲で入れてください"); return; }
    const fatRaw = el("wf").value.trim();
    const fat = fatRaw === "" ? null : Number(fatRaw);
    if (fat !== null && (!isFinite(fat) || fat < 0 || fat > 70)){ toast("体脂肪率は 0〜70％ の範囲で入れてください"); return; }
    beginReal();
    S.weights = S.weights.filter(function(w){ return w.date !== d; });
    S.weights.push({id:uid(), date:d, kg:r1(kg), fat:fat, memo:el("wm").value.trim() || null});
    save(); render();
    toast(jDate(d) + " の体重を " + r1(kg) + "kg で書きとめました");
    return;
  }

  if (f.id === "fm"){
    let entry;
    if (ui.mCustom){
      const name = el("cn").value.trim(), kcal = Number(el("ck").value);
      if (!name || !isFinite(kcal) || kcal < 0){ toast("名前とカロリーを入れてください"); return; }
      entry = {id:uid(), date:ui.mDate, slot:ui.mSlot, name:name, amount:"手書き",
               kcal:Math.round(kcal), p:Number(el("cp").value)||0, f:Number(el("cf").value)||0, c:Number(el("cc").value)||0};
    } else {
      const g = mealGrams();
      if (g <= 0){ toast("いくつ食べたかを入れてください"); return; }
      const food = mealFood(), u = mealUnit(), q = Number(ui.mQty), n = nutriOf(food, g);
      entry = {id:uid(), date:ui.mDate, slot:ui.mSlot, name:food.name,
               amount: q === 1 ? u[0] : u[0] + " × " + q, kcal:n.kcal, p:n.p, f:n.f, c:n.c};
    }
    beginReal();
    S.meals.push(entry); save(); render();
    toast(entry.name + "（" + entry.kcal + "kcal）を書きとめました");
    return;
  }

  if (f.id === "fx"){
    const min = exMinutes();
    if (min <= 0){ toast("時間は1分以上で入れてください"); return; }
    let name, mets;
    if (ui.xCustom){
      name = el("xn").value.trim(); mets = Number(ui.xMets);
      if (!name || !isFinite(mets) || mets <= 0){ toast("運動の名前と METs を入れてください"); return; }
    } else { const e = exItem(); name = e.name; mets = e.mets; }
    /* 見本を片づける前に計算する。そうしないと体重の拠りどころが消え、
       画面に出ている値と保存される値が食い違う。 */
    const kg = currentWeight(), kcal = exKcal(mets, kg, min);
    beginReal();
    S.exercises.push({id:uid(), date:ui.xDate, name:name, mets:mets, minutes:min, kcal:kcal});
    save(); render();
    toast(name + " " + min + "分（" + kcal + "kcal）を書きとめました");
    return;
  }

  if (f.id === "fp"){
    const p = {sex:el("ps").value, age:Number(el("pa").value), height:Number(el("ph").value),
               activity:el("pv").value, target:Number(el("pt").value), pace:Number(el("pp").value)};
    if (!(p.height >= 100 && p.height <= 250)){ toast("身長は 100〜250cm の範囲で入れてください"); return; }
    if (!(p.age >= 10 && p.age <= 120)){ toast("年齢は 10〜120歳 の範囲で入れてください"); return; }
    if (!(p.target >= 20 && p.target <= 300)){ toast("目標体重は 20〜300kg の範囲で入れてください"); return; }
    beginReal();
    S.profile = p; save(); render();
    toast("からだの情報を書きとめました");
  }
});

/* ── 控えの書き出し・読み込み ───────────────── */
function doExport(){
  const name = "karada-" + today() + ".json";
  const json = JSON.stringify(S, null, 2);
  if (saveDown){
    saveDown.save({filename:name, data:json})
      .then(function(){ toast("控えを書き出しました"); })
      .catch(function(err){
        if (err && err.code === "declined") return;            /* 断られたら何もしない */
        toast("控えを書き出せませんでした");
      });
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("控えを書き出しました");
  } catch (e){ toast("控えを書き出せませんでした"); }
}
function doImport(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try {
      const d = JSON.parse(String(reader.result));
      S = {sample:false, profile:d.profile || null,
           weights:Array.isArray(d.weights)?d.weights:[],
           meals:Array.isArray(d.meals)?d.meals:[],
           exercises:Array.isArray(d.exercises)?d.exercises:[]};
      save(); render(); toast("控えを読み込みました");
    } catch (e){ toast("このファイルは読み込めませんでした"); }
  };
  reader.readAsText(file);
  input.value = "";
}

/* ── 配色の切り替え ─────────────────────────── */
/* Claudeの表示枠では入れ物側が配色を決めるので、そこでは出さない */
const THEME_CYCLE = [["auto","自動"],["light","明るい"],["dark","暗い"]];
function currentTheme(){
  try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e){ return "auto"; }
}
function paintThemeButton(){
  const b = el("theme-btn");
  if (!b) return;
  const now = currentTheme();
  const found = THEME_CYCLE.find(function(t){ return t[0] === now; }) || THEME_CYCLE[0];
  b.textContent = "配色：" + found[1];
  b.hidden = inArtifact;
}
if (!inArtifact){
  el("theme-btn").addEventListener("click", function(){
    const now = currentTheme();
    const i = THEME_CYCLE.findIndex(function(t){ return t[0] === now; });
    const next = THEME_CYCLE[(i + 1) % THEME_CYCLE.length][0];
    try { localStorage.setItem(THEME_KEY, next); } catch (e){ /* 保存できなくても切り替えは効く */ }
    applyTheme(next);
    paintThemeButton();
  });
}
paintThemeButton();

/* ── 起動 ───────────────────────────────────── */
render();

/* Claudeの表示枠では、貸してもらえた保存機能が届いてからボタンを出す */
if (inArtifact){
  claude.use("downloads").then(function(d){
    if (!d) return;
    saveDown = d;
    const b = el("btn-export");
    if (b) b.hidden = false;
  }).catch(function(){ /* 使えない環境ではボタンを出さない */ });
}
</script>
